[project]
name = "nano-agent"
version = "0.1.0"
description = "Evidence-driven AI agent for Apple Intelligence with CLI and Telegram interfaces."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "crawl4ai>=0.7,<1.0",
  "ddgs>=9.0,<10.0",
  "httpx>=0.28,<1.0",
  "openai>=1.0,<2.0",
  "pydantic>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "tzlocal>=5.0,<6.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  # Prompt fixtures and evidence excerpts intentionally preserve long source text.
  "E501",
  # dotenv must load before the application modules read environment configuration.
  "E402",
  # `str, Enum` preserves the existing JSON-compatible enum behaviour explicitly.
  "UP042",
]

[tool.uv]
package = false
